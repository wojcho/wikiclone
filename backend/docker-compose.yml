services:
  postgres:
    image: postgres:18

    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

  api:
    build: .

    environment:
      DATABASE_URL: postgresql+psycopg://wiki:wiki@postgres:5432/wiki
      JWT_SECRET: SECRET_HERE

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
